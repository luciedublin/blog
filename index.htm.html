<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon Blog</title>
    <style>
      :root {
        --bg: #fafaf8;
        --text: #1c1c1a;
        --muted: #8a8a86;
        --accent: #c2410c;
        --border: #e7e7e3;
        font-family: Georgia, "Times New Roman", serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
        max-width: 680px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      header { margin-bottom: 56px; }
      h1 {
        font-size: 1.9rem;
        font-weight: 400;
        letter-spacing: -0.02em;
      }
      h1 span { color: var(--accent); }
      header p { color: var(--muted); font-size: 0.95rem; margin-top: 6px; }
      nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 24px; }
      nav button {
        font-family: inherit;
        font-size: 0.8rem;
        padding: 5px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.15s ease;
      }
      nav button:hover { border-color: var(--text); color: var(--text); }
      nav button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
      article {
        padding: 28px 0;
        border-bottom: 1px solid var(--border);
      }
      article .meta {
        font-size: 0.78rem;
        color: var(--muted);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      article h2 {
        font-size: 1.25rem;
        font-weight: 400;
        margin: 8px 0;
      }
      article h2 a { color: inherit; text-decoration: none; }
      article h2 a:hover { color: var(--accent); }
      article p { font-size: 0.95rem; color: #44443f; }
      footer {
        margin-top: 56px;
        color: var(--muted);
        font-size: 0.8rem;
        text-align: center;
      }
      .empty { color: var(--muted); text-align: center; padding: 40px 0; font-style: italic; }
      @media (max-width: 480px) {
        body { padding: 32px 18px; }
        h1 { font-size: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Mon <span>Blog</span></h1>
      <p>Carnet de bord — écrit par Lucie</p>
      <nav id="filters"></nav>
    </header>

    <main id="posts"></main>

    <footer>© 2026 — Fait avec ❤ en vibe coding</footer>

    <script>
      // ---- Données des articles : c'est ici que tu ajoutes tes billets ! ----
      const POSTS = [
        {
          date: "7 octobre 2026",
          tag: "IA",
          title: "Mes débuts en vibe coding",
          text: "J'ai décidé d'apprendre à créer des sites avec l'aide de l'IA. Première leçon : décrire clairement ce qu'on veut, c'est déjà la moitié du travail."
        },
        {
          date: "1 octobre 2026",
          tag: "IA",
          title: "3 outils IA à essayer absolument",
          text: "Entre l'écriture, l'image et le code, voici une petite sélection d'outils qui m'ont fait gagner du temps ce mois-ci."
        },
        {
          date: "20 septembre 2026",
          tag: "Apprendre",
          title: "Pourquoi j'apprends à coder (un peu)",
          text: "Pas pour devenir développeuse, mais pour comprendre comment les choses fonctionnent — et mieux dialoguer avec les outils IA."
        },
        {
          date: "12 septembre 2026",
          tag: "Idées",
          title: "Mon idée de site : et si…",
          text: "Quelques idées en vrac de projets web à tester : un carnet de lecture, une checklist de voyages, ou un mini-quiz entre amis."
        }
      ];

      const postsEl = document.getElementById("posts");
      const filtersEl = document.getElementById("filters");
      let activeTag = "Tout";

      function render() {
        // Filtres
        const tags = ["Tout", ...new Set(POSTS.map((p) => p.tag))];
        filtersEl.innerHTML = "";
        tags.forEach((tag) => {
          const btn = document.createElement("button");
          btn.textContent = tag;
          if (tag === activeTag) btn.classList.add("active");
          btn.onclick = () => {
            activeTag = tag;
            render();
          };
          filtersEl.appendChild(btn);
        });

        // Articles
        const list = activeTag === "Tout" ? POSTS : POSTS.filter((p) => p.tag === activeTag);
        postsEl.innerHTML = list.length
          ? list
              .map(
                (p) => `
                <article>
                  <div class="meta">${p.date} · ${p.tag}</div>
                  <h2><a href="#">${p.title}</a></h2>
                  <p>${p.text}</p>
                </article>`
              )
              .join("")
          : '<div class="empty">Aucun article dans cette catégorie.</div>';
      }

      render();
    </script>
  </body>
</html>
